name: Notify AJAXWebsite of Update

on:
  push:
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule update in AJAXWebsite
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.SUBMODULE_SYNC_TOKEN }}" \
            -H "User-Agent: GitHub-Actions-Submodule-Sync" \
            https://github.com \
            -d '{"event_type":"submodule-updated"}'
