name: Notify AJAXWebsite of Update

on:
  push:
    branches:
      - master

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule update in AJAXWebsite
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_SYNC_TOKEN }}
        run: |
          curl --fail-with-body --request POST \
            --url https://api.github.com/repos/Fehnris/AJAXWebsite/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"submodule-updated"}'
